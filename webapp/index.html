<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Matematika sayyorasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Matematika sayyorasi — dizayn tizimi ===== */
  :root {
    --violet: #5B4BDB;      /* sayyora — asosiy rang */
    --violet-deep: #3A2FA8;
    --star: #FFC23D;        /* yulduz — urg'u */
    --mint: #1FA971;        /* muvaffaqiyat */
    --coral: #E5484D;       /* xato */
    --bg: #F4F3FC;          /* lavanda fon */
    --card: #FFFFFF;
    --line: #E7E5F6;
    --text: #1D1A3A;        /* siyoh */
    --hint: #6E6A8F;
    --chip: #EEEBFF;
    --link: var(--violet);
    --btn: var(--violet);
    --btn-text: #FFFFFF;
    --bg2: var(--bg);
    --ok: var(--mint);
    --bad: var(--coral);
    --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
    --display: 'Unbounded', 'Onest', system-ui, sans-serif;
    --body: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #12112A; --card: #1C1A3B; --line: #2C2955; --text: #F1EFFF; --hint: #A29FC9; --chip: #2A2660;
    --violet: #8577FF; --link: #A79DFF; --btn: #6F60F0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 14px 104px; }
  body.no-nav #app { padding-bottom: 32px; }
  h1 { font: 700 21px/1.2 var(--display); letter-spacing: -0.01em; margin: 6px 4px 14px; }
  h2 { font: 600 15px/1.3 var(--body); color: var(--hint); margin: 22px 6px 10px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--hint); font-size: 13.5px; }
  .pre { white-space: pre-wrap; }
  .center { text-align: center; }
  a { color: var(--link); }
  :focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }

  /* ---- ikonka ---- */
  .ico { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .chipi { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--chip); color: var(--violet); }
  .chipi.y { background: #FFF3D6; color: #B7791F; } .chipi.g { background: #DDF6EA; color: #13804F; } .chipi.r { background: #FFE5E5; color: #C2363B; } .chipi.b { background: #E1EEFF; color: #2F6FD6; }
  [data-theme="dark"] .chipi.y { background: #3B3220; color: var(--star); } [data-theme="dark"] .chipi.g { background: #173A2E; color: #4ADE9B; }
  [data-theme="dark"] .chipi.r { background: #3D1E25; color: #FF8B8E; } [data-theme="dark"] .chipi.b { background: #1C2C4D; color: #7FB0FF; }

  /* ---- sayyora sarlavhasi (bosh sahifa) ---- */
  .hero { position: relative; overflow: hidden; border-radius: 28px; padding: 18px 18px 20px; color: #fff; margin-bottom: 18px;
    background: radial-gradient(120% 90% at 100% 0%, #7D6CFF 0%, var(--violet) 45%, var(--violet-deep) 100%); }
  .hero .planet { position: absolute; right: -58px; top: -58px; width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFE29A 0%, var(--star) 38%, #F39B1F 100%); box-shadow: inset -18px -14px 0 rgba(0,0,0,.12); }
  .hero .orbit { position: absolute; right: -96px; top: -2px; width: 270px; height: 96px; border: 2px solid rgba(255,255,255,.35); border-radius: 50%; transform: rotate(-18deg); }
  .hero .moon { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; top: -6px; left: 50%; animation: orbit 14s linear infinite; offset-path: ellipse(135px 48px at 135px 48px); }
  @keyframes orbit { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  .hero .stars { position: absolute; inset: 0; background-image: radial-gradient(1.5px 1.5px at 18% 30%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 42% 18%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 30% 78%, rgba(255,255,255,.8) 50%, transparent 51%), radial-gradient(1px 1px at 64% 62%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 8% 60%, rgba(255,255,255,.7) 50%, transparent 51%); opacity: .8; }
  .hero > *:not(.planet):not(.orbit):not(.stars) { position: relative; }
  .hero .who { display: flex; align-items: center; gap: 12px; max-width: calc(100% - 96px); }
  .hero .who > div:last-child { min-width: 0; }
  .hero .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero .avatar { width: 46px; height: 46px; border-radius: 15px; background: rgba(255,255,255,.18); display: grid; place-items: center; font: 700 18px var(--display); }
  .hero .name { font-weight: 700; font-size: 16px; }
  .hero .phone { font-size: 13px; opacity: .78; }
  .hero .bal-l { margin-top: 22px; font-size: 13px; opacity: .8; }
  .hero .bal { font: 700 32px/1.1 var(--display); letter-spacing: -0.02em; margin: 2px 0 14px; }
  .hero .bal small { font: 600 15px var(--body); opacity: .85; margin-left: 4px; }
  .hero .acts { display: flex; gap: 8px; }
  .hero .acts button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 14px; padding: 11px 10px; font: 600 14px var(--body); cursor: pointer; }
  .hero .acts .p { background: var(--star); color: #2B2100; }
  .hero .acts .s { background: rgba(255,255,255,.16); color: #fff; }

  /* ---- asosiy ikki ish ---- */
  .duo { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; }
  .big { position: relative; overflow: hidden; border: 0; text-align: left; border-radius: var(--r-lg); padding: 16px; min-height: 132px; color: var(--text); background: var(--card); cursor: pointer; font: inherit; display: flex; flex-direction: column; justify-content: space-between; }
  .big .t { font: 700 16px/1.2 var(--display); }
  .big .s { font-size: 13px; color: var(--hint); margin-top: 4px; }
  .big.main { background: var(--text); color: var(--bg); }
  .big.main .s { color: var(--bg); opacity: .7; }
  .big.main .chipi { background: var(--star); color: #2B2100; }
  .big .deco { position: absolute; right: 10px; bottom: 6px; font: 700 54px/1 var(--display); opacity: .08; letter-spacing: -0.04em; pointer-events: none; }

  /* ---- ro'yxatlar ---- */
  .card { background: var(--card); border-radius: var(--r-lg); padding: 16px; margin-bottom: 10px; }
  .list { background: var(--card); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; width: 100%; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; position: relative; }
  .row + .row::before { content: ''; position: absolute; top: 0; left: 66px; right: 0; height: 1px; background: var(--line); }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 13px; color: var(--hint); }
  .row:active, .big:active, .opt:active, .btn:active { transform: scale(.985); }
  .chev { color: var(--hint); font-size: 20px; line-height: 1; }
  .badge { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--chip); color: var(--violet); white-space: nowrap; }
  .badge.ok { background: #DDF6EA; color: #13804F; }
  [data-theme="dark"] .badge.ok { background: #173A2E; color: #4ADE9B; }
  button.badge { border: 0; cursor: pointer; font-family: inherit; }

  /* ---- tugmalar, formalar ---- */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: var(--r-md); padding: 14px; font: 600 15px var(--body); background: var(--btn); color: var(--btn-text); cursor: pointer; margin-top: 10px; transition: transform .1s; }
  .btn.sec { background: var(--card); color: var(--violet); }
  .btn:disabled { opacity: .5; }
  .tabs { display: flex; background: var(--card); border-radius: var(--r-md); padding: 4px; gap: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 12px; font: 600 13.5px var(--body); color: var(--hint); cursor: pointer; }
  .tabs button.on { background: var(--violet); color: #fff; }
  input, select, textarea { width: 100%; padding: 13px 14px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--card); color: var(--text); font: 15px var(--body); margin-bottom: 10px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--violet); }
  textarea { min-height: 96px; resize: vertical; }
  label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--hint); margin: 6px 4px 6px; }
  .file-pick { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--card); margin-bottom: 10px; cursor: pointer; border: 1.5px dashed var(--line); color: var(--hint); font-weight: 500; }
  .file-pick img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chips button { border: 1.5px solid var(--line); padding: 8px 13px; border-radius: 99px; background: var(--card); color: var(--text); font: 600 13.5px var(--body); cursor: pointer; }
  .chips button.on { background: var(--violet); border-color: var(--violet); color: #fff; }
  .opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .opt-row input { margin: 0; }
  .opt-row .ok { width: 46px; height: 46px; flex: none; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font: 700 15px var(--display); color: var(--hint); cursor: pointer; }
  .opt-row .ok.on { background: var(--mint); color: #fff; border-color: var(--mint); }

  /* ---- test ishlash ---- */
  .q-head { display: flex; justify-content: space-between; align-items: center; margin: 4px 4px 10px; font-weight: 600; }
  .timer { font: 700 15px var(--display); font-variant-numeric: tabular-nums; background: var(--card); padding: 6px 12px; border-radius: 99px; }
  .timer.low { color: #fff; background: var(--coral); }
  .progress { height: 8px; background: var(--card); border-radius: 9px; overflow: hidden; margin-bottom: 14px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), #9B8CFF); border-radius: 9px; transition: width .25s; }
  .q-body { font: 600 19px/1.4 var(--body); white-space: pre-wrap; margin-bottom: 16px; }
  .q-img { width: 100%; border-radius: var(--r-md); margin-bottom: 14px; background: var(--bg); }
  .opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 9px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--card); color: var(--text); font: 500 16px var(--body); cursor: pointer; transition: border-color .15s, background .15s; }
  .opt .l { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--chip); color: var(--violet); font: 700 14px var(--display); }
  .opt.sel { border-color: var(--violet); background: var(--chip); }
  .opt.sel .l { background: var(--violet); color: #fff; }
  .res-big { font: 700 52px/1 var(--display); letter-spacing: -0.03em; text-align: center; margin: 10px 0 6px; }
  .mark-ok { color: var(--mint); } .mark-bad { color: var(--coral); }
  .medal { width: 30px; text-align: center; font: 700 15px var(--display); color: var(--hint); }
  .me { background: var(--chip); }
  .empty { text-align: center; color: var(--hint); padding: 34px 16px; background: var(--card); border-radius: var(--r-lg); margin-bottom: 10px; }
  .thumb { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: var(--chip); flex: none; }
  .book-img { width: 100%; max-height: 320px; object-fit: contain; border-radius: var(--r-lg); background: var(--card); }
  .cert-img { width: 100%; border-radius: var(--r-md); background: var(--bg); display: block; }
  .ad { border: 1.5px solid var(--line); }
  .grade { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--chip); color: var(--violet); font: 700 14px var(--display); letter-spacing: -0.02em; }

  /* ---- admin ---- */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--card); border-radius: var(--r-md); padding: 12px 14px; }
  .stat b { display: block; font: 700 20px/1.2 var(--display); letter-spacing: -0.02em; }
  .stat span { font-size: 12.5px; color: var(--hint); }
  .alert { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; padding: 14px; border-radius: var(--r-lg); margin-bottom: 6px; background: var(--star); color: #2B2100; font: inherit; cursor: pointer; }
  .alert small { opacity: .75; }
  .alert .chev { color: #2B2100; margin-left: auto; }
  .kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; }
  .kv + .kv { border-top: 1px solid var(--line); }
  .kv span { color: var(--hint); font-size: 14px; }
  .kv b { text-align: right; font-weight: 600; }
  .row-btns { display: flex; gap: 8px; } .row-btns .btn { flex: 1; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .add-row { display: flex; gap: 8px; align-items: flex-start; } .add-row input, .add-row textarea { margin: 0; flex: 1; } .add-row .btn { width: auto; margin: 0; padding: 13px 16px; }
  .set { padding: 12px 14px; }
  .topup-h { display: flex; justify-content: space-between; gap: 12px; }
  .topup-h img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; cursor: zoom-in; flex: none; }
  .sub { font-size: 13px; color: var(--hint); }
  .badge[disabled] { opacity: .35; }
  .sw { width: 46px; height: 28px; border-radius: 99px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .sw i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .15s; }
  .sw.on { background: var(--mint); } .sw.on i { left: 21px; }

  /* ---- pastki navigatsiya ---- */
  nav.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(532px, calc(100% - 24px)); display: flex; justify-content: space-around;
    background: var(--card); border-radius: 22px; padding: 7px 6px calc(7px + env(safe-area-inset-bottom, 0px) / 2); box-shadow: 0 10px 30px rgba(29,26,58,.14); z-index: 5; }
  nav.tabbar button { flex: 1; border: 0; background: none; color: var(--hint); font: 600 11.5px var(--body); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 14px; cursor: pointer; }
  nav.tabbar button.on { color: var(--violet); background: var(--chip); }
  body.no-nav nav.tabbar { display: none; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; z-index: 10; max-width: 90%; text-align: center; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 6px); } }
  .spinner { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--violet); border-radius: 50%; animation: spin .8s linear infinite; margin: 70px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .hero .moon { animation: none; } * { transition: none !important; } }
</style>

</head>
<body>
<div id="app"><div class="spinner"></div></div>
<nav class="tabbar" id="tabbar" hidden></nav>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const app = document.getElementById('app');
  const L = 'ABCDEF';
  let ME = null;
  const stack = []; // ekranlar tarixi (orqaga tugmasi uchun)
  let quiz = null;

  if (tg) { tg.ready(); tg.expand(); }

  // ---------- Mavzu (yorug' / qorong'i) — Telegram rejimiga moslashadi ----------
  function applyTheme() {
    const dark = !!(tg && tg.colorScheme === 'dark');
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const bg = dark ? '#12112A' : '#F4F3FC';
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) { /* eski Telegram versiyasi */ }
  }
  applyTheme();
  if (tg && tg.onEvent) tg.onEvent('themeChanged', applyTheme);

  // ---------- Ikonkalar (chiziqli SVG) ----------
  const svg = (d) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const I = {
    test: svg('<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>'),
    video: svg('<circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/>'),
    trophy: svg('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),
    wallet: svg('<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v3h-4a2 2 0 0 0 0 4h4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/>'),
    book: svg('<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/>'),
    school: svg('<path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M10 21v-5h4v5"/>'),
    teacher: svg('<path d="M2 3h20M4 3v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3M12 16v5M8 21h8"/><path d="m8 11 3-3 2 2 3-3"/>'),
    award: svg('<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/>'),
    key: svg('<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14 9l2 2"/>'),
    chat: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>'),
    file: svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>'),
    home: svg('<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    shield: svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>'),
    users: svg('<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 7.5M22 21a7 7 0 0 0-4-6.3"/>'),
  };
  const navRow = (k, icon, tone, title, subtitle) => `<button class="row" data-act="open" data-arg="${k}">
    <span class="chipi ${tone}">${I[icon]}</span><span class="grow"><div class="title">${title}</div>${subtitle ? `<div class="sub">${subtitle}</div>` : ''}</span><span class="chev">›</span></button>`;

  // ---------- yordamchilar ----------
  const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => `${String(Math.trunc(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')} so'm`;
  const pad = (n) => String(n).padStart(2, '0');
  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
  const date = (ms) => { const d = new Date(ms); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
  const haptic = (t = 'light') => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };

  function toast(text) {
    document.querySelectorAll('.toast').forEach((x) => x.remove()); // oldingisini olib tashlaymiz
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  async function api(path, body) {
    const opt = { method: body ? 'POST' : 'GET', headers: { 'X-Init-Data': tg ? tg.initData : '' } };
    if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    const r = await fetch(path, opt);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || 'Xatolik'); e.code = data.code; e.data = data; throw e; }
    return data;
  }

  const openLink = (url) => (tg ? tg.openLink(url) : window.open(url, '_blank'));

  function confirmBox(text) {
    return new Promise((res) => (tg && tg.showConfirm ? tg.showConfirm(text, res) : res(window.confirm(text))));
  }

  // ---------- navigatsiya ----------
  function go(screen, ...args) {
    if (quiz && screen !== quizScreen && screen !== resultScreen) stopQuizTimer();
    stack.push([screen, args]);
    return render();
  }
  function back() {
    if (quiz && quiz.running) {
      return confirmBox("Testdan chiqasizmi? Javoblaringiz saqlanmaydi.").then((ok) => {
        if (!ok) return;
        stopQuizTimer(); quiz = null; stack.pop(); render();
      });
    }
    stack.pop();
    if (!stack.length) stack.push([homeScreen, []]);
    return render();
  }
  // Pastki navigatsiya: asosiy bo'limlar
  const TABS = () => [
    { fn: homeScreen, icon: 'home', name: 'Asosiy' },
    ME && ME.features.tests && { fn: testsCats, icon: 'test', name: 'Testlar' },
    ME && ME.features.rating && { fn: ratingScreen, icon: 'trophy', name: 'Reyting' },
    { fn: balanceScreen, icon: 'wallet', name: 'Balans' },
    ME && ME.admin && { fn: adminScreen, icon: 'shield', name: 'Admin' },
  ].filter(Boolean);
  function drawTabbar(screen) {
    const bar = document.getElementById('tabbar');
    const tabs = ME ? TABS() : [];
    const show = stack.length === 1 && tabs.some((t) => t.fn === screen);
    document.body.classList.toggle('no-nav', !show);
    bar.hidden = !show;
    if (!show) return;
    bar.innerHTML = tabs.map((t, i) => `<button class="${t.fn === screen ? 'on' : ''}" data-tab="${i}" aria-label="${t.name}">${I[t.icon]}<span>${t.name}</span></button>`).join('');
    bar.querySelectorAll('button').forEach((b) => { b.onclick = () => { haptic(); stack.length = 0; go(tabs[Number(b.dataset.tab)].fn); }; });
  }

  async function render() {
    const [screen, args] = stack[stack.length - 1];
    if (tg) { stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide(); tg.MainButton.hide(); }
    drawTabbar(screen);
    window.scrollTo(0, 0);
    try { await screen(...args); }
    catch (e) { app.innerHTML = `<div class="card center"><p>⚠️ ${h(e.message)}</p><button class="btn sec" data-back>⬅️ Orqaga</button></div>`; bind(); }
  }
  if (tg) tg.BackButton.onClick(back);

  const loading = () => { app.innerHTML = '<div class="spinner"></div>'; };

  // Sarlavha va tugmalardagi emoji olib tashlanadi — ikonkalar SVG tizimida
  const EMO = /^[\p{Extended_Pictographic}⬅➡️‍\s]+|[\s\p{Extended_Pictographic}⬅➡️‍]+$/gu;
  function polish() {
    app.querySelectorAll('h1, .btn, .tabs button, .chips button').forEach((el) => {
      for (const n of el.childNodes) {
        if (n.nodeType === 3) { const t = n.textContent.replace(EMO, ''); if (t !== n.textContent) n.textContent = t; }
      }
    });
  }

  // data-* atributlar orqali tugmalarga hodisa biriktirish
  const actions = {};
  function bind() {
    polish();
    app.querySelectorAll('[data-act]').forEach((el) => {
      el.onclick = () => { haptic(); const fn = actions[el.dataset.act]; if (fn) fn(el.dataset.arg, el); };
    });
    app.querySelectorAll('[data-back]').forEach((el) => { el.onclick = back; });
  }

  // ---------- Test ishlash ----------
  function stopQuizTimer() { if (quiz && quiz.timer) { clearInterval(quiz.timer); quiz.timer = null; } }

  async function startQuiz(type, id, code) {
    loading();
    try {
      const d = await api('/api/quiz/start', { type, id, code });
      quiz = { ...d, type, ownerId: id, code, idx: 0, answers: {}, running: true, offset: Date.now() - d.now };
      go(quizScreen);
    } catch (e) { toast(e.message); back(); }
  }

  function quizScreen() {
    const qz = quiz;
    if (!qz) return back();
    const q = qz.questions[qz.idx];
    const total = qz.questions.length;
    const sel = qz.answers[q.id];
    app.innerHTML = `
      <div class="q-head"><span class="muted">${qz.idx + 1} / ${total}</span>${qz.deadline ? '<span class="timer" id="timer"></span>' : ''}</div>
      <div class="progress"><i style="width:${(qz.idx / total) * 100}%"></i></div>
      <div class="card">
        ${q.photo ? `<img class="q-img" src="${q.photo}" alt="">` : ''}
        ${q.body ? `<div class="q-body">${h(q.body)}</div>` : ''}
        ${q.options.map((o, i) => `<button class="opt ${sel === i ? 'sel' : ''}" data-act="pick" data-arg="${i}"><span class="l">${L[i]})</span><span>${h(o)}</span></button>`).join('')}
      </div>
      <div style="display:flex; gap:8px">
        ${qz.idx > 0 ? '<button class="btn sec" style="flex:1" data-act="prev">⬅️</button>' : ''}
        <button class="btn" style="flex:3" data-act="next">${qz.idx + 1 < total ? 'Keyingi ➡️' : '✅ Yakunlash'}</button>
      </div>`;
    actions.pick = (i) => { qz.answers[q.id] = Number(i); quizScreen(); };
    actions.prev = () => { qz.idx -= 1; quizScreen(); };
    actions.next = async () => {
      if (qz.idx + 1 < total) { qz.idx += 1; return quizScreen(); }
      const left = total - Object.keys(qz.answers).length;
      if (left && !(await confirmBox(`${left} ta savolga javob berilmagan. Yakunlaysizmi?`))) return;
      submitQuiz(false);
    };
    bind();
    if (qz.deadline && !qz.timer) qz.timer = setInterval(tick, 500);
    tick();
  }

  function tick() {
    if (!quiz || !quiz.deadline) return;
    const left = quiz.deadline - (Date.now() - quiz.offset);
    const el = document.getElementById('timer');
    if (el) { el.textContent = `⏱ ${mmss(left)}`; el.classList.toggle('low', left < 60000); }
    if (left <= 0 && quiz.running) { toast('⏰ Vaqt tugadi!'); submitQuiz(true); }
  }

  async function submitQuiz(timeUp) {
    const qz = quiz;
    if (!qz || !qz.running) return;
    qz.running = false;
    stopQuizTimer();
    loading();
    try {
      const r = await api('/api/quiz/submit', { attempt: qz.attempt, answers: qz.answers });
      haptic('heavy');
      stack.pop(); // test ekranini tarixdan olib tashlaymiz
      go(resultScreen, qz, r, timeUp);
    } catch (e) { toast(e.message); stack.pop(); render(); }
  }

      <h2>Javoblar</h2>

          <span class="grow"><div class="title">${i + 1}. ${h((q.body || 'Rasmdagi savol').slice(0, 70))}</div>
          <div class="muted">Sizning javobingiz: ${d.your == null ? '—' : L[d.your]} · To'g'ri: <b>${L[d.correct]}</b></div></span>
          ${d.has_sol ? `<button class="badge" style="border:0;cursor:pointer" data-act="sol" data-arg="${d.id}:${i + 1}">🎥 Yechim</button>` : ''}</div>`;
      }).join('')}</div>
      <button class="btn" data-act="again">🔁 Qayta ishlash</button>
      <button class="btn sec" data-back>⬅️ Orqaga</button>`;
    actions.sol = async (arg) => {
      const [id, num] = arg.split(':');
      try {
        const res = await api('/api/solution/send', { id: Number(id), num: Number(num) });
        if (res.url) openLink(res.url); else toast('🎥 Video yechim chatga yuborildi');

    actions.again = () => { stack.pop(); startQuiz(qz.type, qz.ownerId); };

  // =====================================================================
  // ---------- Yordamchilar: rasm tanlash (kichraytirib JPEG qilinadi) ----------
  function readImage(file, max = 1600) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = () => reject(new Error("Rasmni o'qib bo'lmadi"));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Bu rasm emas'));
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  const pickerHtml = (id, label) => `<label class="file-pick" for="${id}"><img id="${id}_pv" alt="" hidden><span id="${id}_lb">🖼 ${h(label)}</span></label>
    <input type="file" id="${id}" accept="image/*" hidden>`;
  function bindPicker(id, state) {
    const inp = document.getElementById(id);
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      try {
        state.image = await readImage(f);
        const pv = document.getElementById(`${id}_pv`); pv.src = state.image; pv.hidden = false;
        document.getElementById(`${id}_lb`).textContent = '✅ Rasm tanlandi (almashtirish uchun bosing)';
      } catch (e) { toast(e.message); }
    };
  }
  const val = (id) => (document.getElementById(id) || {}).value || '';
  async function submitting(el, fn) {
    if (el.disabled) return;
    el.disabled = true;
    try { await fn(); } catch (e) {
      if (e.code === 'nofunds' && (await confirmBox(`${e.message}\n\nBalansni to'ldirasizmi?`))) go(topupScreen);
      else if (e.code !== 'nofunds') toast(e.message);
    } finally { el.disabled = false; }
  }
  const doneCard = (icon, title, text) => {
    app.innerHTML = `<div class="card center" style="margin-top:30px"><p style="font-size:44px;margin:0">${icon}</p><h1>${title}</h1><p class="muted pre">${text}</p></div>

  function ttQuestionScreen(testId, title, count) {
    const st = { image: null, opts: ['', '', '', ''], correct: -1 };
    const draw = () => {
      app.innerHTML = `<h1>➕ Savol qo'shish</h1><div class="muted" style="margin:-6px 6px 10px">${h(title || '')}${count ? ` · kiritilgan: ${count}` : ''}</div>

        ${pickerHtml('q_img', 'Rasmli savol bo\'lsa — rasm tanlang (ixtiyoriy)')}
        <label class="lbl">2. Javob variantlari — to'g'risini harf tugmasi bilan belgilang</label>
        ${st.opts.map((o, i) => `<div class="opt-row"><button class="ok ${st.correct === i ? 'on' : ''}" data-act="ok" data-arg="${i}">${L[i]}</button>
          <input id="q_o${i}" maxlength="200" value="${h(o)}" placeholder="${L[i]} variant"></div>`).join('')}
        ${st.opts.length < 6 ? '<button class="btn sec" data-act="more">➕ Yana variant</button>' : ''}
        <div class="muted" style="margin:4px 4px 10px">🎥 Video yechim har savolga emas — butun test uchun bitta, test sahifasida qo'shiladi.</div>
        <button class="btn" data-act="save">💾 Saqlash va keyingi savol</button>
        <button class="btn sec" data-act="done">✅ Tayyor</button>`;
      bindPicker('q_img', st);
      if (st.image) { const pv = document.getElementById('q_img_pv'); pv.src = st.image; pv.hidden = false; }
      bind();
    };
    const keep = () => { st.body = val('q_body'); st.opts = st.opts.map((_, i) => val(`q_o${i}`)); };
    actions.ok = (i) => { keep(); st.correct = Number(i); draw(); };
    actions.more = () => { keep(); st.opts.push(''); draw(); };
    actions.done = () => { stack.pop(); go(ttDetailScreen, testId); };
    actions.save = (a, el) => submitting(el, async () => {
      keep();
      const options = st.opts.map((o) => o.trim());
      const filled = options.filter(Boolean);
      if (!st.body.trim() && !st.image) return toast('Savol matnini yozing yoki rasm tanlang');
      if (filled.length < 2) return toast('Kamida 2 ta variant kiriting');
      if (st.correct < 0 || !options[st.correct]) return toast("To'g'ri javob harfini bosing");
      // bo'sh variantlarni olib tashlab, to'g'ri javob indeksini moslaymiz
      const correct = options.slice(0, st.correct).filter(Boolean).length;
      const r = await api('/api/teacher/question', { test_id: testId, body: st.body, options: filled, correct, image: st.image });
      haptic('medium'); toast(`✅ Saqlandi (jami ${r.count} ta)`);
      stack.pop(); go(ttQuestionScreen, testId, title, r.count);
    });
    draw();
  }

  // Faylni serverga yuklash (video / PDF / rasm) — Telegram file_id qaytadi
  async function uploadFile(fileOrBlob, kind, name) {
    const r = await fetch(`/api/admin/upload?kind=${kind}&name=${encodeURIComponent(name || fileOrBlob.name || 'fayl')}`, {
      method: 'POST', headers: { 'X-Init-Data': tg ? tg.initData : '', 'Content-Type': fileOrBlob.type || 'application/octet-stream' }, body: fileOrBlob,
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Yuklashda xato');
    return d;
  }
  const dataUrlToBlob = async (u) => (await fetch(u)).blob();
  // Fayl tanlash maydoni (video/PDF) — tanlanganda yuklaydi
  const filePickHtml = (id, label, accept) => `<label class="file-pick" for="${id}"><span id="${id}_lb">📎 ${h(label)}</span></label><input type="file" id="${id}" accept="${accept}" hidden>`;
  function bindFile(id, kind, state, key) {
    const inp = document.getElementById(id);
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      if (f.size > 50 * 1024 * 1024) return say('Fayl 50 MB dan katta — Telegram qabul qilmaydi');
      const lb = document.getElementById(`${id}_lb`);
      lb.textContent = `⏳ Yuklanmoqda: ${f.name} (${(f.size / 1048576).toFixed(1)} MB)...`;
      try {
        const r = await uploadFile(f, kind, f.name);
        state[key] = r; lb.textContent = `✅ Yuklandi: ${f.name}`;
      } catch (e) { lb.textContent = `❌ ${e.message}`; }
    };
  }

  // Admin: savol qo'shish (rasm bilan). Video yechim — butun test uchun bitta, «Tahrirlash» da.
  function adQuestionScreen(type, ownerId, title, count) {
    const st = { image: null, opts: ['', '', '', ''], correct: -1 };
    const draw = () => {
      app.innerHTML = `<h1>Savol qo'shish</h1><div class="muted" style="margin:-8px 4px 12px">${h(title || '')}${count ? ` · kiritilgan: ${count}` : ''}</div>
        <label class="lbl">1. Savol matni</label><textarea id="q_body" maxlength="800" placeholder="Masalan: 12 - 5 = ?">${h(st.body || '')}</textarea>
        ${pickerHtml('q_img', "Rasmli savol bo'lsa — rasm tanlang (ixtiyoriy)")}
        <label class="lbl">2. Javob variantlari — to'g'risini harf tugmasi bilan belgilang</label>
        ${st.opts.map((o, i) => `<div class="opt-row"><button class="ok ${st.correct === i ? 'on' : ''}" data-act="ok" data-arg="${i}">${L[i]}</button>
          <input id="q_o${i}" maxlength="200" value="${h(o)}" placeholder="${L[i]} variant"></div>`).join('')}
        ${st.opts.length < 6 ? '<button class="btn sec" data-act="more">Yana variant</button>' : ''}
        <div class="muted" style="margin:4px 4px 10px">🎥 Video yechim har savolga emas — barcha savollardan keyin butun test uchun bitta qo'shiladi («Tayyor» → «Tahrirlash»).</div>
        <button class="btn" data-act="save">Saqlash va keyingi savol</button><button class="btn sec" data-act="done">Tayyor</button>`;
      bindPicker('q_img', st);
      if (st.image) { const pv = document.getElementById('q_img_pv'); pv.src = st.image; pv.hidden = false; }
      bind();
    };
    const keep = () => { st.body = val('q_body'); st.opts = st.opts.map((_, i) => val(`q_o${i}`)); };
    actions.ok = (i) => { keep(); st.correct = Number(i); draw(); };
    actions.more = () => { keep(); st.opts.push(''); draw(); };
    actions.done = () => { stack.pop(); render(); };
    actions.save = (a, el) => submitting(el, async () => {
      keep();
      const options = st.opts.map((o) => o.trim()); const filled = options.filter(Boolean);
      if (!st.body.trim() && !st.image) return say('Savol matnini yozing yoki rasm tanlang');
      if (filled.length < 2) return say('Kamida 2 ta variant kiriting');
      if (st.correct < 0 || !options[st.correct]) return say("To'g'ri javob harfini bosing");
      let photo = null;
      if (st.image) photo = (await uploadFile(await dataUrlToBlob(st.image), 'photo', 'savol.jpg')).file_id;
      const body = { type, owner_id: ownerId, body: st.body, options: filled, correct: options.slice(0, st.correct).filter(Boolean).length, photo_file: photo };
      const r = await api('/api/admin/question', body);
      haptic('medium'); say(`✅ Saqlandi (jami ${r.count} ta)`);
      stack.pop(); go(adQuestionScreen, type, ownerId, title, r.count);
    });
    draw();
  }

        <div class="sub">${statusName[a.status]} · ${date(a.ends)} gacha · 👁 ${a.shows}${a.btn_url ? ` · tugma: ${h(a.btn_text)}` : ''}</div>
        <div class="row-btns"><button class="btn sec" data-act="days" data-arg="${a.id}">Muddat</button><button class="btn sec" data-act="tgl" data-arg="${a.id}">${a.status === 'paused' ? 'Yoqish' : "To'xtatish"}</button></div>
        <div class="row-btns"><button class="btn sec" data-act="bc" data-arg="${a.id}">Hammaga yuborish</button><button class="btn sec" data-act="del" data-arg="${a.id}" style="color:var(--bad)">O'chirish</button></div></div>`).join('')
        : '<div class="empty">Reklamalar yo\'q</div>'}`;
    const call = async (path, body, msg) => { try { const r = await api(path, body); if (msg) say(typeof msg === 'function' ? msg(r) : msg); adAdsScreen(); } catch (e) { say(e.message); } };
    actions.new = () => go(adAdFormScreen);
    actions.days = (id) => go(adDaysScreen, 'Reklama muddati', async (days) => api('/api/admin/ad/save', { id: Number(id), days }));
    actions.tgl = (id) => call('/api/admin/ad/toggle', { id: Number(id) });
    actions.bc = async (id) => { if (await confirmBox('Reklama barcha foydalanuvchilarga yuborilsinmi?')) call('/api/admin/ad/broadcast', { id: Number(id) }, (r) => `📢 ${r.total} ta foydalanuvchiga yuborilmoqda`); };
    actions.del = async (id) => { if (await confirmBox("Reklama o'chirilsinmi?")) call('/api/admin/ad/delete', { id: Number(id) }); };
    bind();
  }
  function adAdFormScreen() {
    const st = { media: null, days: 7 };
    app.innerHTML = `<h1>Yangi reklama</h1>
      <label class="lbl">Matn</label><textarea id="a_text" maxlength="3500" placeholder="Reklama matni"></textarea>
      <label class="lbl">Rasm yoki video (ixtiyoriy)</label>${filePickHtml('a_media', 'Rasm yoki video tanlang', 'image/*,video/*')}
      <div class="two"><div><label class="lbl">Tugma matni</label><input id="a_bt" maxlength="60" placeholder="Batafsil"></div><div><label class="lbl">Tugma havolasi</label><input id="a_bu" maxlength="500" placeholder="https://..."></div></div>
      <label class="lbl">Muddat (kun)</label><div class="chips" id="a_days">${[1, 3, 7, 15, 30, 60].map((n) => `<button data-act="d" data-arg="${n}" class="${n === 7 ? 'on' : ''}">${n} kun</button>`).join('')}</div>
      <button class="btn" data-act="save">Joylash</button>`;
    const inp = document.getElementById('a_media');
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      const lb = document.getElementById('a_media_lb'); lb.textContent = `⏳ Yuklanmoqda: ${f.name}...`;
      try {
        const isVid = (f.type || '').startsWith('video');
        const r = isVid ? await uploadFile(f, 'video', f.name) : await uploadFile(await dataUrlToBlob(await readImage(f)), 'photo', 'reklama.jpg');
        st.media = { ...r, kind: isVid ? 'video' : 'photo' }; lb.textContent = `✅ Yuklandi: ${f.name}`;
      } catch (e) { lb.textContent = `❌ ${e.message}`; }
    };
    actions.d = (n, el) => { st.days = Number(n); document.querySelectorAll('#a_days button').forEach((b) => b.classList.toggle('on', b === el)); };
    actions.save = (a, el) => submitting(el, async () => {
      const text = val('a_text').trim();
      if (!text && !st.media) return say('Matn yozing yoki rasm/video tanlang');
      const body = { text, days: st.days, btn_text: val('a_bt'), btn_url: val('a_bu').trim() };
      if (st.media) { body.media_file = st.media.file_id; body.media_kind = st.media.kind; }
      await api('/api/admin/ad/save', body); say('✅ Reklama joylandi'); back();
    });
    bind();
  }
  // Umumiy "necha kun" formasi
  function adDaysScreen(title, save) {
    app.innerHTML = `<h1>${h(title)}</h1><p class="muted" style="margin:0 4px 10px">Bugundan boshlab necha kun? (0 — hozir to'xtatish)</p>
      <div class="chips">${[0, 1, 3, 7, 15, 30, 60, 90].map((n) => `<button data-act="d" data-arg="${n}">${n ? `${n} kun` : "To'xtatish"}</button>`).join('')}</div>
      <input id="dd" type="number" inputmode="numeric" placeholder="yoki kunlar sonini yozing"><button class="btn" data-act="ok">Saqlash</button>`;
    const run = async (n) => { try { await save(n); say('✅ Saqlandi'); back(); } catch (e) { say(e.message); } };
    actions.d = (n) => run(Number(n));
    actions.ok = () => { const n = val('dd'); if (n === '') return say('Kunlar sonini kiriting'); run(Number(n)); };
    bind();
  }

  // ---------- E'lonlar ----------
  async function adListingsScreen(table = 'books', mode = 'active') {
    loading();
    const list = await api(`/api/admin/listings?table=${table}&mode=${mode}`);
    app.innerHTML = `<h1>E'lonlar</h1>
      <div class="tabs"><button class="${table === 'books' ? 'on' : ''}" data-act="lt" data-arg="books">Kitoblar</button><button class="${table === 'centers' ? 'on' : ''}" data-act="lt" data-arg="centers">O'quv markazlar</button></div>
      <div class="chips"><button class="${mode === 'active' ? 'on' : ''}" data-act="lm" data-arg="active">Faol</button><button class="${mode === 'expired' ? 'on' : ''}" data-act="lm" data-arg="expired">Muddati tugagan</button></div>
      ${list.length ? `<div class="list">${list.map((x) => `<div class="row"><span class="grow"><div class="title">${h(x.title)}</div>
        <div class="sub">${h(x.sub || '')}${x.sub ? ' · ' : ''}${h(x.owner)} · ${date(x.expires)} gacha</div></span>
        <button class="badge" data-act="ld" data-arg="${x.id}">📅</button><button class="badge" data-act="lx" data-arg="${x.id}">🗑</button></div>`).join('')}</div>` : '<div class="empty">E\'lonlar yo\'q</div>'}`;
    actions.lt = (t) => { stack[stack.length - 1][1] = [t, mode]; adListingsScreen(t, mode); };
    actions.lm = (m) => { stack[stack.length - 1][1] = [table, m]; adListingsScreen(table, m); };
    actions.ld = (id) => go(adDaysScreen, "E'lon muddati", async (days) => api('/api/admin/listing/days', { table, id: Number(id), days }));
    actions.lx = async (id) => { if (!(await confirmBox("E'lon o'chirilsinmi?"))) return; try { await api('/api/admin/listing/delete', { table, id: Number(id) }); adListingsScreen(table, mode); } catch (e) { say(e.message); } };
    bind();
  }

  // ---------- Narxlar, sozlamalar, bo'limlar ----------
  async function adSettingsScreen(tab = 'settings') {
    loading();
    const d = await api('/api/admin/settings');
    app.innerHTML = `<h1>${tab === 'settings' ? 'Narxlar va sozlamalar' : "Bo'limlar"}</h1>
      <div class="tabs"><button class="${tab === 'settings' ? 'on' : ''}" data-act="st" data-arg="settings">Narxlar</button><button class="${tab === 'features' ? 'on' : ''}" data-act="st" data-arg="features">Bo'limlar</button></div>
      ${tab === 'settings' ? d.settings.map((x) => `<div class="card set"><label class="lbl" for="s_${x.key}">${h(x.help)}</label>
          <div class="add-row">${x.text ? `<textarea id="s_${x.key}" style="min-height:${x.key === 'payment_info' ? 90 : 46}px">${h(x.value)}</textarea>` : `<input id="s_${x.key}" type="number" inputmode="numeric" value="${h(x.value)}">`}
          <button class="btn" data-act="sv" data-arg="${x.key}">Saqlash</button></div></div>`).join('')
      : `<p class="muted" style="margin:0 4px 10px">O'chirilgan bo'lim foydalanuvchilarga ko'rinmaydi (adminlarga ko'rinadi).</p>
        <div class="list">${d.features.map((f) => `<div class="row"><span class="grow title" style="white-space:normal">${h(f.name)}</span>${swHtml(f.on, 'ft', f.key)}</div>`).join('')}</div>`}`;
    actions.st = (t) => { stack[stack.length - 1][1] = [t]; adSettingsScreen(t); };
    actions.sv = (key, el) => submitting(el, async () => { await api('/api/admin/setting', { key, value: val(`s_${key}`) }); say('✅ Saqlandi'); });
    actions.ft = async (key) => { try { await api('/api/admin/feature', { key }); adSettingsScreen('features'); } catch (e) { say(e.message); } };
    bind();
  }

  // ---------- Hammaga xabar ----------
  function adBroadcastScreen() {
    const st = { image: null };
    app.innerHTML = `<h1>Hammaga xabar</h1><p class="muted" style="margin:0 4px 10px">Xabar barcha ro'yxatdan o'tgan (bloklanmagan) foydalanuvchilarga bot orqali yuboriladi.</p>
      <textarea id="b_text" maxlength="3500" placeholder="Xabar matni"></textarea>${pickerHtml('b_img', 'Rasm (ixtiyoriy)')}
      <button class="btn" data-act="send">Yuborish</button>`;
    bindPicker('b_img', st);
    actions.send = (a, el) => submitting(el, async () => {
      const text = val('b_text').trim();
      if (!text && !st.image) return say('Xabar yozing');
      if (!(await confirmBox('Xabar barcha foydalanuvchilarga yuborilsinmi?'))) return;
      const photo = st.image ? (await uploadFile(await dataUrlToBlob(st.image), 'photo', 'xabar.jpg')).file_id : null;
      const r = await api('/api/admin/broadcast', { text, photo_file: photo });
      doneCard('📢', 'Yuborish boshlandi', `${r.total} ta foydalanuvchiga yuborilmoqda. Tugagach botda hisobot keladi.`);
    });
    bind();
  }

  // ---------- Ishga tushirish ----------
  async function boot() {
    if (tg && !tg.initData) {
      app.innerHTML = '<div class="card center" style="margin-top:40px"><p style="font-size:40px;margin:0">📱</p>' +
        '<p>Mini ilovani botdagi <b>«📱 Mini ilovani ochish»</b> tugmasi yoki chat pastidagi <b>«📱 Ilova»</b> (Menu) tugmasi orqali oching.</p>' +
        '<button class="btn" id="close">Botga qaytish</button></div>';
      document.getElementById('close').onclick = () => tg.close();
      return;
    }
    try {
      stack.push([homeScreen, []]);
      await homeScreen();
    } catch (e) {
      stack.length = 0;
      let extra = '';
      if (e.code === 'not_subscribed') extra = `<button class="btn" id="join">📢 Kanalga o'tish</button><button class="btn sec" id="retry">✅ Obuna bo'ldim</button>`;
      if (e.code === 'not_registered') extra = '<p class="muted">Botga qaytib /start ni bosing va ro\'yxatdan o\'ting.</p><button class="btn" id="close">Botga qaytish</button>';
      app.innerHTML = `<div class="card center" style="margin-top:40px"><p style="font-size:40px;margin:0">${e.code === 'blocked' ? '🚫' : e.code === 'maintenance' ? '🛠' : '⚠️'}</p><p>${h(e.message)}</p>${extra}</div>`;
      const j = document.getElementById('join'); if (j) j.onclick = () => e.data && e.data.channelUrl && (tg ? tg.openTelegramLink(e.data.channelUrl) : openLink(e.data.channelUrl));
      const r = document.getElementById('retry'); if (r) r.onclick = () => { loading(); boot(); };
      const c = document.getElementById('close'); if (c) c.onclick = () => (tg ? tg.close() : null);
    }
  }
  boot();
})();
</script>
</body>
</html>
